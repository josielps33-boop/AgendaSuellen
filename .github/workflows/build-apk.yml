texto = texto.replace(
                  "JavaVersion.VERSION_8",
                  "JavaVersion.VERSION_17"
              )

              texto = texto.replace(
                  "VERSION_1_8",
                  "VERSION_17"
              )

          # Kotlin 17
          if "kotlinOptions" not in texto:
              texto += """

          kotlinOptions {
              jvmTarget = '17'
          }
          """
          else:
              texto = texto.replace(
                  'jvmTarget = "1.8"',
                  'jvmTarget = "17"'
              )

              texto = texto.replace(
                  "jvmTarget = '1.8'",
                  "jvmTarget = '17'"
              )

          arquivo.write_text(texto)

          print("")
          print("======================================")
          print("Java/Kotlin configurados para 17")
          print("======================================")
