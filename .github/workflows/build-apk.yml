name: Construir APK Agenda Suelen

on:
  workflow_dispatch:
  push:
    paths:
      - 'AgendaSuelen_Android_v4.zip'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Android
        uses: android-actions/setup-android@v4
        with:
          packages: 'platforms;android-35 build-tools;35.0.0'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.9'

      - name: Descompactar projeto
        run: |
          mkdir -p android
          unzip -q AgendaSuelen_Android_v4.zip -d android

      - name: Verificar ferramentas
        run: |
          java -version
          sdkmanager --version
          gradle --version

      - name: Verificar projeto
        working-directory: android
        run: |
          ls -la
          ls -la app

      - name: Compilar APK
        working-directory: android
        run: |
          gradle assembleDebug --no-daemon --stacktrace

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: AgendaSuelen-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
