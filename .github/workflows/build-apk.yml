name: Construir APK Agenda Suelen

on:
  workflow_dispatch:
  push:
    paths:
      - 'AgendaSuelen_Android_v4.zip'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          sdkmanager --version
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Descompactar projeto
        run: |
          mkdir -p android
          unzip -q AgendaSuelen_Android_v4.zip -d android

      - name: Compilar APK
        working-directory: android
        run: |
          gradle assembleDebug --no-daemon

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: AgendaSuelen-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
