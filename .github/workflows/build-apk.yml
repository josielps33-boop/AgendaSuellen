name: Construir APK Agenda Suelen

on:
  workflow_dispatch:

  push:
    paths:
      - '*.zip'
      - '.github/workflows/build-apk.yml'


jobs:

  build:

    runs-on: ubuntu-latest

    steps:


      - name: Baixar projeto
        uses: actions/checkout@v4


      - name: Configurar Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'


      - name: Configurar Android
        uses: android-actions/setup-android@v4
        with:
          packages: 'platforms;android-35 build-tools;35.0.0'


      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.9'


      - name: Localizar e extrair projeto
        shell: bash
        run: |

          echo "======================================"
          echo "PROCURANDO ZIP DA AGENDA SUELEN"
          echo "======================================"

          ZIP=$(find . -maxdepth 1 -type f -iname 'AgendaSuelen_Android*.zip' | head -n 1)

          if [ -z "$ZIP" ]; then
            echo "ERRO: nenhum ZIP AgendaSuelen_Android encontrado."
            echo ""
            echo "Arquivos disponíveis:"
            ls -lah
            exit 1
          fi

          echo "ZIP encontrado:"
          echo "$ZIP"

          mkdir -p android

          unzip -q "$ZIP" -d android

          echo ""
          echo "======================================"
          echo "PROJETO EXTRAÍDO"
          echo "======================================"

          find android -maxdepth 4 -type f | head -200


      - name: Encontrar raiz do projeto Android
        shell: bash
        run: |

          echo "======================================"
          echo "LOCALIZANDO settings.gradle"
          echo "======================================"

          SETTINGS=$(find android -type f \( \
            -name "settings.gradle" \
            -o \
            -name "settings.gradle.kts" \
          \) | head -n 1)

          if [ -z "$SETTINGS" ]; then
            echo "ERRO: settings.gradle não encontrado."
            echo ""
            echo "Estrutura encontrada:"
            find android -maxdepth 6 -type f
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS")

          echo "Projeto Android encontrado em:"
          echo "$PROJECT_DIR"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"


      - name: Verificar estrutura do projeto
        shell: bash
        run: |

          echo "======================================"
          echo "ESTRUTURA DO PROJETO"
          echo "======================================"

          echo "Diretório:"
          echo "$PROJECT_DIR"

          echo ""
          echo "Arquivos:"
          find "$PROJECT_DIR" -maxdepth 3 -type f


      - name: Corrigir Java e Kotlin para 17
        shell: bash
        run: |

          python3 <<'PY'

          import os
          from pathlib import Path

          project = Path(os.environ["PROJECT_DIR"])

          print("======================================")
          print("PROCURANDO MÓDULO APP")
          print("======================================")

          groovy = list(project.rglob("app/build.gradle"))
          kotlin = list(project.rglob("app/build.gradle.kts"))

          print("build.gradle encontrados:")

          for arquivo in groovy:
              print(" -", arquivo)

          print("")

          print("build.gradle.kts encontrados:")

          for arquivo in kotlin:
              print(" -", arquivo)

          if groovy:

              arquivo = groovy[0]

              print("")
              print("Usando:")
              print(arquivo)

              texto = arquivo.read_text()

              # Java 17
              if "compileOptions" not in texto:

                  texto = texto.replace(
                      "android {",
                      """android {

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          """,
                      1
                  )

              else:

                  texto = texto.replace(
                      "JavaVersion.VERSION_1_8",
                      "JavaVersion.VERSION_17"
                  )

                  texto = texto.replace(
                      "jvmTarget = '1.8'",
                      "jvmTarget = '17'"
                  )

                  texto = texto.replace(
                      'jvmTarget = "1.8"',
                      'jvmTarget = "17"'
                  )

              # Kotlin 17
              if "kotlinOptions" not in texto:

                  texto += """

          kotlinOptions {
              jvmTarget = '17'
          }
          """

              arquivo.write_text(texto)

              print("")
              print("Java target: 17")
              print("Kotlin target: 17")
              print("Configuração concluída.")

          elif kotlin:

              arquivo = kotlin[0]

              print("")
              print("ATENÇÃO: projeto usa Kotlin DSL:")
              print(arquivo)

              texto = arquivo.read_text()

              if "compileOptions" not in texto:

                  texto = texto.replace(
                      "android {",
                      """android {

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
          """,
                      1
                  )

              if "kotlinOptions" not in texto:

                  texto += """

          kotlinOptions {
              jvmTarget = "17"
          }
          """

              texto = texto.replace(
                  'jvmTarget = "1.8"',
                  'jvmTarget = "17"'
              )

              arquivo.write_text(texto)

              print("")
              print("Kotlin DSL configurado para Java/Kotlin 17.")

          else:

              print("")
              print("ERRO: módulo app não encontrado.")
              raise SystemExit(1)

          PY


      - name: Verificar Java
        shell: bash
        run: |

          echo "======================================"
          echo "JAVA"
          echo "======================================"

          java -version


      - name: Verificar Gradle
        shell: bash
        run: |

          echo "======================================"
          echo "GRADLE"
          echo "======================================"

          gradle --version


      - name: Compilar APK
        shell: bash
        run: |

          echo "======================================"
          echo "COMPILANDO APK"
          echo "======================================"

          cd "$PROJECT_DIR"

          echo "Diretório de compilação:"
          pwd

          gradle assembleDebug --no-daemon --stacktrace


      - name: Procurar APK
        shell: bash
        run: |

          echo "======================================"
          echo "PROCURANDO APK"
          echo "======================================"

          APK=$(find "$PROJECT_DIR" -type f -name "app-debug.apk" | head -n 1)

          if [ -z "$APK" ]; then
            echo "ERRO: APK não foi gerado."
            exit 1
          fi

          echo "APK ENCONTRADO:"
          echo "$APK"

          echo ""
          ls -lh "$APK"

          echo "APK_PATH=$APK" >> "$GITHUB_ENV"


      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: AgendaSuelen-debug-apk
          path: ${{ env.APK_PATH }}
