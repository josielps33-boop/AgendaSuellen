      - name: Verificar projeto
        run: |
          echo "======================================"
          echo "PROJETO:"
          echo "$PROJECT_DIR"
          echo ""
          echo "BUILD GRADLE:"
          echo "$APP_GRADLE"
          echo "======================================"

          echo ""
          echo "Conteúdo do projeto:"
          ls -la "$PROJECT_DIR"

          echo ""
          echo "Conteúdo do módulo app:"
          ls -la "$PROJECT_DIR/app"


      - name: Verificar Java
        run: |
          java -version


      - name: Verificar Gradle
        run: |
          gradle --version


      - name: Compilar APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          gradle assembleDebug --no-daemon --stacktrace


      - name: Verificar APK
        run: |
          APK=$(find "$PROJECT_DIR" -type f -path '*/build/outputs/apk/debug/app-debug.apk' | head -n 1)

          if [ -z "$APK" ]; then
            echo "ERRO: APK não foi encontrado."
            exit 1
          fi

          echo "APK encontrado:"
          ls -lh "$APK"

          echo "APK=$APK" >> "$GITHUB_ENV"


      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: AgendaSuelen-debug-apk
          path: ${{ env.APK }}
